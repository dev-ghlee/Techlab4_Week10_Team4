; HitoriGame 실행 설정. 실행 파일 옆 Config 폴더에서 읽는다.
; 항목이 없거나 값이 잘못되면 코드의 기본값을 쓴다.

[Game]
; 시작할 씬. 실행 파일 폴더 기준 상대 경로
GameDefaultMap=Scenes/Demo_1_LightTypes.scene
; 비워 두면 하늘을 그리지 않는다
SkyPanorama=Assets/SkySphere/IceEscapeSnowPanorama-v2.png

[Window]
Title=Hitori
; 0이면 주 모니터 해상도. Borderless=1과 함께 쓰면 테두리 없는 전체 화면이 된다
ResolutionSizeX=1600
ResolutionSizeY=900
Borderless=0
VSync=1

; 키 이름과 값 형식은 editor.ini의 [Rendering]과 같다
[Rendering]
RenderingPath=Forward
LightingModel=Phong
LightCullingMode=Tiled
EnableFXAA=1
CacheShadows=1
; 0=Off 1=Sample8 2=Sample16 3=Sample32 4=PCSS
PcfMode=1
DirectionalShadowMapSize=1024
PointShadowMapSize=512
SpotShadowMapSize=512
GammaCorrection=1
DisplayGamma=2.2
ShowVignette=1
ShowCameraOverlay=1
